<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="UNIQUE TEXTIL Kft. – kanadai használtruha nagykereskedés Nyíregyházán."><title>🔥 Akciók | UNIQUE TEXTIL Kft.</title><link rel="stylesheet" href="style.css"></head><body><div class="site-top"><a class="brand" href="index.html">UNIQUE TEXTIL Kft.<small>Kanadai használtruha nagykereskedés · Nyíregyháza</small></a><nav class="site-nav" aria-label="Főmenü"><a href="index.html">Főoldal</a><a href="akciok.html" aria-current="page">Akciók</a><a href="arlista.html">Árlista</a><a href="termekvideok.html">Termékvideók</a><a href="szallitas.html">Szállítás</a><a href="kapcsolat.html">Kapcsolat</a><a class="lang" href="https://depozit-hainesecond.ro/" lang="ro">RO</a></nav></div><main class="site-main"><header class="page-banner"><h1>🔥 Akciók</h1></header><div class="tools"><input id="search" class="search" type="search" placeholder="🔎 Akciós termék keresése…" aria-label="Akciós termék keresése"><span id="count" class="count"></span></div><p id="status" class="status" role="status">Akciós termékek betöltése…</p><div id="products" class="card-grid promo-grid"></div><p class="below-link"><a href="arlista.html">Teljes magyar árlista →</a></p></main><footer class="site-footer">© UNIQUE TEXTIL Kft. · Nyíregyháza · <a href="mailto:uniquetextil23@gmail.com">E-mail</a> · <a href="https://wa.me/36705668292">WhatsApp</a></footer><script>
const SOURCES=['https://preturi.depozit-hainesecond.ro/prices.csv','https://raw.githubusercontent.com/bestchoisems/https-depozit-hainesecond-Preturi/main/prices.csv'];
const output=document.getElementById('products'),statusEl=document.getElementById('status'),searchEl=document.getElementById('search'),countEl=document.getElementById('count');let promos=[];
function norm(s){return String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
function field(r,keys){for(const k of keys){let v=r[norm(k)];if(v!==undefined&&String(v).trim()!=='')return String(v).trim()}return ''}
function parseCSV(s){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function isPromo(r){return norm(field(r,['Kategoria']))==='promo'}
function isActive(r){const v=norm(field(r,['aktiv','active','aktív']));return !v||['da','yes','igen','true','1','aktiv','active','x'].includes(v)}
function money(v){let s=String(v??'').trim();if(!s)return '';return /(?:ft|huf)\b/i.test(s)?s:s+' Ft'}
function add(parent,tag,text,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=text;parent.append(el);return el}
function render(){const q=norm(searchEl.value);const found=promos.filter(p=>norm(p.name+' '+p.desc).includes(q));output.replaceChildren();countEl.textContent=found.length+' akciós termék';for(const p of found){const card=document.createElement('article');card.className='promo-card';add(card,'span','AKCIÓ','promo-tag');add(card,'h2',p.name);if(p.desc)add(card,'p',p.desc);if(p.old&&p.old!==p.price)add(card,'div','Korábbi ár: '+money(p.old),'promo-old');if(p.price)add(card,'div',money(p.price)+' / bála','promo-price');if(p.kg)add(card,'div',p.kg.replace(/\s*kg$/i,'')+' kg / bála','promo-kg');if(p.unit)add(card,'div','Egységár: '+money(p.unit)+' / kg','promo-kg');const a=document.createElement('a');a.className='promo-contact';a.href='https://wa.me/36705668292?text='+encodeURIComponent('Szia! Érdeklődöm az akciós termék iránt: '+p.name);a.textContent='Érdeklődöm WhatsAppon';card.append(a);output.append(card)}statusEl.hidden=found.length>0;statusEl.textContent=promos.length?(q?'Nincs találat erre a keresésre.':'Jelenleg nincs megjeleníthető akciós termék.'):'Jelenleg nincs promócióként megjelölt termék az árlistában.'}
async function load(){for(const source of SOURCES){try{const r=await fetch(source+(source.includes('?')?'&':'?')+'v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);const rows=parseCSV((await r.text()).replace(/^\uFEFF/,''));if(rows.length<1)throw Error('Üres CSV');const headers=rows[0].map(norm);promos=rows.slice(1).map(c=>Object.fromEntries(headers.map((h,i)=>[h,(c[i]||'').trim()]))).filter(r=>isActive(r)&&isPromo(r)).map(r=>({name:field(r,['hu termék','hu termek','termék','termek']),desc:field(r,['hu leírás','hu leiras','leírás','leiras']),kg:field(r,['kg']),price:field(r,['ár/bála','ar/bala','ár bála','ar bala']),unit:field(r,['ár/kg','ar/kg']),old:field(r,['régi ár/bála','regi ar/bala','eredeti ár','eredeti ar','old price','pret vechi'])})).filter(p=>p.name);render();return}catch(e){console.warn('CSV nem érhető el:',source,e)}}statusEl.hidden=false;statusEl.textContent='Az árlista jelenleg nem tölthető be. Próbáld meg később.';countEl.textContent=''}
searchEl.addEventListener('input',render);load();
<script src="site.js" defer></script>
</body>
</html>
